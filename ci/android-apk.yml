# =============================================================================
# PayInter Android APK build — GitHub Actions
#
# HOW TO ENABLE (one-time, ~60 segundos):
#   1. No GitHub, abra o repo PayInter → Add file → Upload files.
#   2. Envie ESTE arquivo como `.github/workflows/android-apk.yml`
#      (a pasta + o nome importam!). Ou: no editor do GitHub, crie o arquivo
#      `.github/workflows/android-apk.yml` e cole este conteúdo.
#   3. Commit direto na branch main ou arena/01a038be-payinter.
#
# Depois: Actions → "Build Android APK" → Run workflow.
# O APK sai como artefato "payinter-debug-apk" e na GitHub Release "apk-latest".
#
# A app é uma PWA (Vite + React, offline-first). O APK embrulha essa webapp com
# Capacitor — por isso o offline-first funciona também dentro do Android.
# Nota: com a webview no dispositivo, a API tem de ser pública/HTTPS — defina
# `apiUrl` quando correr o workflow (opcional em dev: mesmo host da PWA).
# =============================================================================

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      apiUrl:
        description: 'Backend API URL baked into the APK (https origin reachable from the phone)'
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Build the offline-first PWA
        working-directory: mobile
        env:
          VITE_API_BASE: ${{ github.event.inputs.apiUrl }}
        run: npm run build

      - name: Add Android platform (first run only)
        working-directory: mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web bundle + manifest
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payinter-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk payinter.apk
          gh release delete -y apk-latest 2>/dev/null || true
          git tag -f apk-latest 2>/dev/null || true
          git push -f origin apk-latest 2>/dev/null || true
          gh release create apk-latest payinter.apk \
            --title "PayInter Android APK (latest)" \
            --notes "Sandbox demo build — offline-first PWA wrapped with Capacitor. Backend: ${{ github.event.inputs.apiUrl || '(same-origin)' }}. Demo login: demo@payinter.app / Demo1234! / PIN 2468"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
