# =============================================================================
# PayInter Android APK build — GitHub Actions
#
# COMO ACTIVAR (uma só vez, ~60 segundos):
#   1. No GitHub, abra o repositório → Add file → Create new file.
#   2. No nome do ficheiro escreva exactamente:
#         .github/workflows/android-apk.yml
#      (a pasta .github/workflows/ tem de existir; o GitHub cria-a ao digitar
#       o nome com barras).
#   3. Cole o conteúdo deste ficheiro (sem as linhas de comentário iniciais,
#      se preferir) e faça Commit.
#
#   4. Depois: separador "Actions" → "Build Android APK" → "Run workflow".
#
# Resultado: o APK fica disponível como artefacto "payinter-debug-apk" e
# também na release "apk-latest" do repositório.
#
# NOTA IMPORTANTE sobre a API
#   A aplicação é uma PWA (Vite + React, offline-first). O Capacitor embrulha
#   o pacote web num contentor Android, por isso o offline-first continua a
#   funcionar dentro do APK. Mas, à semelhança de qualquer aplicação web
#   móvel, para falar com o servidor o telemóvel precisa de um URL público.
#   "localhost" dentro do telemóvel é o próprio telemóvel — não é o servidor.
#
#   O valor por omissão de VITE_API_BASE abaixo aponta para o backend do
#   ambiente de pré-visualização. Assim que o servidor for publicado num
#   endereço definitivo (HTTPS), altere-o aqui ou indique-o no campo "apiUrl"
#   ao executar o workflow manualmente.
# =============================================================================

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      apiUrl:
        description: 'Backend API URL baked into the APK (HTTPS origin reachable from the phone)'
        required: false
        default: ''
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.github/workflows/android-apk.yml'
      - 'mobile/**'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Build the offline-first PWA
        working-directory: mobile
        env:
          # Endereço do backend embutido na aplicação. Substitua pelo domínio
          # definitivo quando o servidor estiver publicado.
          VITE_API_BASE: ${{ github.event.inputs.apiUrl || 'https://4000-i422fnjyga662l1ys67f0.e2b.app' }}
        run: npm run build

      - name: Add Android platform (first run only)
        working-directory: mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web bundle into the native shell
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payinter-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the "apk-latest" release
        continue-on-error: true
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk payinter.apk
          gh release delete -y apk-latest 2>/dev/null || true
          gh release create apk-latest payinter.apk \
            --title "PayInter Android APK (latest)" \
            --notes "Sandbox demo build — offline-first PWA wrapped with Capacitor.
          Demo login: demo@payinter.app / Demo1234! / PIN 2468"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
