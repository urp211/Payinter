name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      apiUrl:
        description: 'Backend API URL baked into the APK (HTTPS origin reachable from the phone)'
        required: false
        default: ''
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.github/workflows/android-apk.yml'
      - 'mobile/**'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Endereço do backend embutido na aplicação.
      API_BASE: ${{ github.event.inputs.apiUrl || 'https://4000-i422fnjyga662l1ys67f0.e2b.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já traz o Android SDK instalado
      # (/usr/local/lib/android/sdk, com android-34 e build-tools 34.0.0).
      # Por isso NÃO se usa android-actions/setup-android, que era o passo que
      # falhava. Aqui apenas se confirma o que está disponível.
      - name: Verify the pre-installed Android SDK
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          ls "$SDK" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true
          java -version 2>&1 | head -2

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Build the offline-first PWA
        working-directory: mobile
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: npm run build

      - name: Add Android platform (first run only)
        working-directory: mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web bundle into the native shell
        working-directory: mobile
        run: npx cap sync android

      - name: Point Gradle at the Android SDK
        working-directory: mobile/android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Show APK details
        continue-on-error: true
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payinter-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the "apk-latest" release
        continue-on-error: true
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk payinter.apk
          gh release delete -y apk-latest 2>/dev/null || true
          gh release create apk-latest payinter.apk \
            --title "PayInter Android APK (latest)" \
            --notes "Sandbox demo build — offline-first PWA wrapped with Capacitor. API: ${API_BASE}. Demo login: demo@payinter.app / Demo1234! / PIN 2468"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Os registos e artefactos da Actions são servidos por domínios que o
      # ambiente de desenvolvimento não alcança. Por isso, os metadados de
      # verificação do APK são publicados numa branch própria (ci-diag), de
      # onde podem ser lidos e conferidos.
      - name: Publish build metadata
        if: success()
        continue-on-error: true
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          AAPT="$SDK/build-tools/$BT/aapt2"
          {
            echo "# PayInter APK — metadados de construção"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| API embutida | \`${API_BASE}\` |"
            echo "| tamanho | $(stat -c %s "$APK") bytes |"
            echo "| sha256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo
            echo "## Identificação do pacote (aapt2)"
            echo '```'
            if [ -x "$AAPT" ]; then
              "$AAPT" dump badging "$APK" 2>&1 | head -20
            else
              echo "(aapt2 indisponível em build-tools/$BT)"
            fi
            echo '```'
            echo
            echo "## Conteúdo do APK (início e fim)"
            echo '```'
            unzip -l "$APK" | head -22
            echo "..."
            unzip -l "$APK" | tail -3
            echo '```'
            echo
            echo "## Confirmação: endereço da API presente no pacote web embutido"
            echo '```'
            unzip -p "$APK" 'assets/public/assets/*.js' 2>/dev/null \
              | grep -o 'https://[0-9]*-[a-z0-9]*\.e2b\.app' | sort -u | head -5 \
              || echo "(não encontrado)"
            echo '```'
          } > /tmp/ci-report.md
          git config user.email "ci@payinter.local"
          git config user.name "PayInter CI"
          git checkout -B ci-diag
          mkdir -p ci-diag
          cp /tmp/ci-report.md ci-diag/build-info.md
          git add -f ci-diag/build-info.md
          git commit -m "ci: build info ${GITHUB_SHA:0:7}" || true
          git push -f origin ci-diag || true

      # Em caso de falha, os dados essenciais são publicados na mesma branch
      # para poderem ser diagnosticados sem acesso aos registos da Actions.
      - name: Publish diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "# PayInter APK — diagnóstico de falha"
            echo
            echo "- data: $(date -u)"
            echo "- commit: ${GITHUB_SHA}"
            echo "- API embutida: ${API_BASE}"
            echo "- java: $(java -version 2>&1 | head -1)"
            echo
            echo "## Android SDK"
            echo '```'
            SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            echo "sdk.dir=$SDK"
            ls "$SDK/platforms" 2>&1 | head -30
            ls "$SDK/build-tools" 2>&1 | head -30
            echo '```'
            echo
            echo "## Gradle (últimas 200 linhas)"
            echo '```'
            tail -200 /tmp/gradle.log 2>&1 || echo "(sem /tmp/gradle.log)"
            echo '```'
          } > /tmp/ci-report.md
          git config user.email "ci@payinter.local"
          git config user.name "PayInter CI"
          git checkout -B ci-diag
          mkdir -p ci-diag
          cp /tmp/ci-report.md ci-diag/diagnostics.md
          git add -f ci-diag/diagnostics.md
          git commit -m "ci: diagnostics ${GITHUB_SHA:0:7}" || true
          git push -f origin ci-diag || true
